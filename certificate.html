<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Good Conduct</title>
<style>
  /* Official Fingerprint Unit branding — Northeastern Police Force / CID.
     Palette mirrors the official emblem: navy shield, gold ring, green banner. */
  :root{
    --navy:#0f2855; --navy-2:#14346b; --gold:#c9a227; --gold-soft:#e3cf8e;
    --green:#0e6b4a; --orange:#b7650e; --border:#b8c5da; --label-bg:#eef2fa;
    --text:#0b1a30; --muted:#4a5a78; --muted-2:#2c3e5c; --paper:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9edf4;font-family:"Georgia","Times New Roman",Times,serif;color:var(--text);font-size:11pt;line-height:1.4}
  /* A4 sheet. Print sizing is owned by @page below; on screen we preview the sheet. */
  .page{width:210mm;min-height:297mm;margin:6mm auto;padding:8mm;background:#fff;position:relative;box-shadow:0 2px 16px rgba(15,40,85,.22)}

  /* --- EXACT A4 PRINT RULES -------------------------------------------------
     One page, A4 portrait, 8mm margins, colors printed exactly as rendered
     (the frames, gold rules, seal and watermark must survive printing), and
     every piece of web chrome (toolbar / buttons / badges) is removed from
     the paper. */
  @media print{
    @page{size:A4 portrait;margin:8mm}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    html,body{background:#fff;width:auto}
    .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
    .toolbar,.btn,.badge{display:none!important}
    .cert-inner,.d-item,.cert-signatures,.cert-issue,.foot{page-break-inside:avoid}
  }

  /* --- official emblem occurrences: the crest in the top masthead above, plus
         this centred, low-opacity watermark behind the certificate body -----
     opacity sits in the spec band (0.08–0.12) and mix-blend-mode:multiply
     guarantees the crest reads on white paper even if a future logo export
     loses its alpha channel. ------------------------------------------------ */
  .watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140mm;opacity:0.09;z-index:0;pointer-events:none;mix-blend-mode:multiply}
  .watermark img{width:100%;height:auto;display:block}
  .content{position:relative;z-index:1}

  /* --- ornate double frame (outer navy + inner gold rule + corner marks) ---- */
  .cert-frame{position:relative;border:4px solid var(--navy);padding:2.2mm;background:#fff}
  .cert-inner{position:relative;border:1.5px solid var(--gold);padding:5.5mm 7mm 5mm 7mm}
  .cert-inner::before,.cert-inner::after{content:"";position:absolute;width:7mm;height:7mm;border:2px solid var(--gold);pointer-events:none}
  .cert-inner::before{top:1.2mm;left:1.2mm;border-right:0;border-bottom:0}
  .cert-inner::after{bottom:1.2mm;right:1.2mm;border-left:0;border-top:0}

  /* --- masthead with the police crest --------------------------------------- */
  .cert-masthead{text-align:center;border-bottom:1.5px solid var(--gold);padding-bottom:2.5mm}
  .crest{line-height:0;margin:0 auto 1.5mm auto}
  .crest img{width:23mm;height:auto}
  .cm-t1{font-family:Arial,sans-serif;font-size:13pt;font-weight:800;letter-spacing:2.2px;color:var(--navy)}
  .cm-t2{font-family:Arial,sans-serif;font-size:10pt;font-weight:700;letter-spacing:.5px;color:var(--green);margin-top:1px}
  .cm-t3{font-family:Arial,sans-serif;font-size:7.5pt;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px;margin-top:2px}

  /* --- title band ------------------------------------------------------------ */
  .cert-title{display:flex;align-items:center;gap:4mm;margin:4.5mm 0 1mm 0}
  .cert-title::before,.cert-title::after{content:"";flex:1;height:1.5px;background:linear-gradient(to right,transparent,var(--gold));min-width:8mm}
  .cert-title::after{background:linear-gradient(to left,transparent,var(--gold))}
  .cert-title h1{font-size:19.5pt;font-weight:700;letter-spacing:3.5px;color:var(--navy);text-align:center;white-space:nowrap}
  .cert-sub{text-align:center;font-style:italic;font-size:10pt;color:var(--muted-2);margin-bottom:1.5mm}

  /* --- certificate name + prose ---------------------------------------------- */
  .cert-name-row{text-align:center;margin:1mm 0 2mm 0}
  .cert-name{display:inline-block;font-size:17.5pt;font-weight:800;font-style:italic;color:var(--navy);border-bottom:2px solid var(--gold);padding:0 8mm 1mm 8mm;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cert-prose{font-size:10.5pt;line-height:1.6;text-align:center;margin:0 4mm}
  .cert-prose b{color:var(--navy)}

  /* --- details panel: refined rules, not a plain table ------------------------ */
  .details{width:96%;margin:3.5mm auto 0 auto;border-top:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);padding:2.2mm 2mm;display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;row-gap:1.1mm;font-family:Arial,sans-serif}
  .d-item .dl{display:block;font-size:6.6pt;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  .d-item .dv{display:block;font-size:9.5pt;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* --- issue ribbon ------------------------------------------------------------ */
  .cert-issue{margin:3.2mm auto 0 auto;width:max-content;max-width:100%;border:1.5px solid var(--gold);border-radius:3px;background:#fbf7ea;padding:1.4mm 7mm;font-family:Arial,sans-serif;font-size:8.5pt;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cert-issue .no{color:var(--green)}

  /* --- signatures + official seal ---------------------------------------------- */
  .cert-signatures{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;margin-top:5mm}
  .sig-block{flex:1;text-align:center;font-family:Arial,sans-serif;min-width:0}
  .sig-script{font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;font-size:14pt;color:var(--navy);height:8.5mm;line-height:1.15;white-space:nowrap;overflow:hidden}
  .sig-line{height:5.5mm;border-bottom:1.5px solid var(--text);margin:0 4mm 1.2mm 4mm}
  .sig-role{font-size:7.4pt;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted-2)}
  .seal-wrap{flex:none;position:relative;width:33mm;height:33mm;margin:0 1mm}
  .seal{position:absolute;inset:0;margin:auto;width:31mm;height:31mm;border:3px double var(--green);color:var(--green);border-radius:50%;display:grid;place-items:center;font-family:Arial,sans-serif;font-weight:900;font-size:7.5pt;letter-spacing:.6px;line-height:1.3;text-align:center;transform:rotate(-14deg);opacity:.9}
  .seal .tick{font-size:11pt;color:var(--gold)}
  .cert-declare{margin-top:3.5mm;text-align:center;font-family:Arial,sans-serif;font-size:7.8pt;font-style:italic;color:var(--muted)}

  /* --- official footer ----------------------------------------------------------- */
  .foot{margin-top:3.5mm;border-radius:3px;overflow:hidden;font-family:Arial,sans-serif}
  .foot .stripe{height:2px;background:linear-gradient(to right,var(--navy) 0%,var(--gold) 50%,var(--green) 100%)}
  .foot .body{background:linear-gradient(to right,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:3px 10px;text-align:center;font-size:8pt;font-weight:700;white-space:nowrap}
  .foot .pill{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:1px 8px;border-radius:8px;font-size:7.5pt;margin:0 6px}
  .foot .phone{color:#ffd96b;font-weight:700}

  /* ---- screen-only chrome: never printed, keeps the A4 sheet clean ---- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:#fafcff;font-family:Arial,sans-serif}
  .btn{border:0;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:var(--navy);text-decoration:none;display:inline-block}
  .btn.ghost{background:#eef1f6;color:#33415c}.btn.green{background:var(--green)}
  .badge{display:inline-flex;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .badge.amber{background:#fff3d9;color:var(--orange)}.badge.green{background:#e3f7f1;color:var(--green)}
  .lock{max-width:210mm;margin:0 auto;padding:80px 20px;text-align:center;font-family:Arial,sans-serif;color:var(--muted)}
  .lock .big{font-size:52px}
  .lock h2{margin:14px 0 8px;color:var(--text)}
  .lock p{color:var(--muted);max-width:460px;margin:8px auto}
  .lock .note{max-width:460px;margin:14px auto;padding:10px 14px;background:#fff8ec;border:1px solid #f2ddae;border-radius:10px;color:#7a5b17;font-size:12px}
</style>
</head>
<body>

<div class="toolbar">
  <a class="btn ghost" href="index.html">&larr; Back to system</a>
  <div style="flex:1"></div>
  <span id="statusBadge" class="badge amber">Checking&hellip;</span>
  <button class="btn green" id="printBtn" style="display:none" onclick="window.print()">&#128424; Print clearance certificate</button>
</div>

<div id="sheet"><div class="lock"><div class="big">&#128274;</div><p>Checking clearance status&hellip;</p></div></div>

<script>
const id=new URLSearchParams(location.search).get('id');
const REVIEW_LOCK_HOURS=12;
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function dash(v){return (v===null||v===undefined||String(v).trim()==='')?'&mdash;':esc(v)}
function dmy(v){
  if(!v) return '&mdash;';
  const s=String(v).trim().slice(0,10);
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m) return m[3]+'/'+m[2]+'/'+m[1];
  const d=new Date(String(v).replace(' ','T')+'Z');
  if(isNaN(d.getTime())) return esc(String(v).slice(0,10));
  return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
}
function ditem(k,v){return '<div class="d-item"><span class="dl">'+k+'</span><span class="dv">'+dash(v)+'</span></div>'}

function locked(a){
  const badge=document.getElementById('statusBadge');
  badge.className='badge amber';
  badge.textContent=(a&&a.status)?a.status:'Locked';
  document.getElementById('printBtn').style.display='none';
  const rev=(a&&a.review)||{};
  const wait=(a&&a.status!=='Approved'&&rev.review_locked)
    ? '<div class="note">&#128274; Review Lock ('+esc(rev.review_window_hours||REVIEW_LOCK_HOURS)+'h Required) - '+
      esc(rev.hours_remaining)+' hours remaining. The certificate unlocks once an authorized officer approves the application'+
      ' (a System Administrator can bypass the mandatory review period).</div>' : '';
  document.getElementById('sheet').innerHTML=
    '<div class="lock"><div class="big">&#128274;</div><h2>Certificate locked</h2>'+
    '<p>The clearance certificate for application <b>'+esc(id||'')+'</b> is only released after an authorized officer approves the application.</p>'+
    '<p>Current status: <b>'+esc((a&&a.status)?a.status:'Pending Review')+'</b>.</p>'+
    wait+
    '<p><a class="btn" href="application.html?id='+encodeURIComponent(id||'')+'">Go to application review &rarr;</a></p></div>';
}

function certificate(a){
  document.getElementById('statusBadge').className='badge green';
  document.getElementById('statusBadge').textContent='Approved';
  document.getElementById('printBtn').style.display='';
  const guardian=[dash(a.guardian_name),a.guardian_relationship?esc('('+a.guardian_relationship+')'):''].filter(x=>x&&x!=='&mdash;').join(' ');
  document.getElementById('sheet').innerHTML=
  '<div class="page">'+
    '<div class="watermark"><img src="images/police_logo.png" alt="Police Watermark"></div>'+
    '<div class="content">'+
      '<div class="cert-frame"><div class="cert-inner">'+
        '<div class="cert-masthead">'+
          '<div class="crest"><img src="images/police_logo.png" alt="Police Crest"></div>'+
          '<div class="cm-t1">NORTHEASTERN POLICE FORCE</div>'+
          '<div class="cm-t2">CRIMINAL INVESTIGATION DIRECTORATE (CID)</div>'+
          '<div class="cm-t3">Fingerprint &amp; Verification Unit &nbsp;&bull;&nbsp; North East State of Somalia</div>'+
        '</div>'+
        '<div class="cert-title"><h1>CERTIFICATE OF GOOD CONDUCT</h1></div>'+
        '<div class="cert-sub">This is to certify that</div>'+
        '<div class="cert-name-row"><span class="cert-name">'+esc(a.full_name)+'</span></div>'+
        '<div class="cert-prose">'+
          (a.sex==='Female'?'daughter':'son/daughter')+' of <b>'+dash(a.mother_name)+'</b>, holder of National ID <b>'+dash(a.national_id)+'</b>'+
          (a.passport_id?(' and Passport <b>'+esc(a.passport_id)+'</b>'):'')+
          ', born on <b>'+dmy(a.date_of_birth)+'</b> at <b>'+dash(a.place_of_birth)+'</b>, has been screened by the '+
          'Fingerprint &amp; Verification Unit for the purpose of <b>'+dash(a.purpose)+'</b>, and '+
          '<b>no adverse criminal record</b> is held against the above-named person in the records of the '+
          'Criminal Investigation Directorate as of the date of issue.'+
        '</div>'+
        '<div class="details">'+
          ditem("Mother's full name",a.mother_name)+
          ditem('National ID (NIRA)',a.national_id)+
          ditem('Passport number',a.passport_id)+
          ditem('Date of birth',dmy(a.date_of_birth))+
          ditem('Place of birth',a.place_of_birth)+
          ditem('Current residence',a.residence||a.current_address)+
          ditem('Occupation',a.occupation)+
          ditem('Purpose of application',a.purpose)+
          ditem('Guarantor',guardian)+
          ditem('Application submitted',dmy(a.created_at))+
          ditem('Certificate issued on',dmy(a.reviewed_at||a.updated_at))+
          ditem('Status','CLEARED')+
        '</div>'+
        '<div class="cert-issue">Certificate No. <span class="no">'+esc(a.certificate_number)+'</span>'+
          ' &nbsp;&middot;&nbsp; Application '+esc(a.application_id)+
          ' &nbsp;&middot;&nbsp; Issued '+dmy(a.reviewed_at||a.updated_at)+'</div>'+
        '<div class="cert-signatures">'+
          '<div class="sig-block">'+
            '<div class="sig-script">'+esc(a.reviewed_by_name||'')+'</div>'+
            '<div class="sig-line"></div>'+
            '<div class="sig-role">Chairperson &mdash; Fingerprint &amp; Verification Unit</div>'+
          '</div>'+
          '<div class="seal-wrap"><div class="seal">POLICE<br>CLEARED<br><span class="tick">&#10003;</span><br>CID &bull; 2026</div></div>'+
          '<div class="sig-block">'+
            '<div class="sig-script"></div>'+
            '<div class="sig-line"></div>'+
            '<div class="sig-role">Director &mdash; Criminal Investigation Directorate</div>'+
          '</div>'+
        '</div>'+
        '<div class="cert-declare">This certificate is issued on the basis of the records available to the Criminal Investigation Directorate at the time of issue and does not exempt the holder from any lawful security procedure.</div>'+
      '</div></div>'+
      '<div class="foot"><div class="stripe"></div><div class="body">'+
        'Criminal Investigation Directorate - North East State of Somalia'+
        '<span class="pill">Fingerprint &amp; Verification Unit</span>'+
        '<span class="phone">&#9742; +252-2754131</span>'+
      '</div></div>'+
    '</div>'+
  '</div>';
}

// NO developer admin fallback: the page never signs itself in.
async function getToken(){
  try{
    const t=localStorage.getItem('sentinel_token');
    if(t) return t;
    const s=JSON.parse(localStorage.getItem('sentinelSession')||'null');
    if(s && s.token) return s.token;
  }catch(_){}
  return '';
}
// Hard re-login: clear every stale session key + cookie and send the officer
// back to the main app instead of rendering a half-authenticated page.
function forceSignIn(reason){
  try{
    localStorage.removeItem('sentinel_token');
    localStorage.removeItem('sentinel_user');
    localStorage.removeItem('sentinelSession');
    document.cookie='sentinel_session=; Path=/; Max-Age=0; SameSite=Lax';
  }catch(_){}
  document.getElementById('sheet').innerHTML=
    '<div class="lock"><div class="big">&#128274;</div><h2>Sign in required</h2>'+
    '<p>'+esc(reason||'Your session has expired')+'. Sign in through the main system to view this certificate.</p>'+
    '<p><a class="btn" href="index.html">Go to sign in &rarr;</a></p></div>';
}
async function load(){
  const token=await getToken();
  if(!token){ forceSignIn('You are not signed in'); return; }
  try{
    const r=await fetch('/api/clearance-applications/'+id,{headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){ forceSignIn('Session expired (401 Unauthorized)'); return; }
    if(!r.ok)throw new Error('not found');
    const a=await r.json();
    if(a.status==='Approved'&&a.certificate_number)certificate(a);else locked(a);
  }catch(e){
    document.getElementById('sheet').innerHTML=
      '<div class="lock"><div class="big">&#128274;</div><h2>Certificate unavailable</h2>'+
      '<p>Application '+esc(id||'')+' could not be loaded. Open it from the Fingerprint register while the server is running.</p>'+
      '<p><a class="btn ghost" href="index.html">Back to system</a></p></div>';
  }
}
load();
</script>
</body>
</html>
