<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Conduct / Clearance Certificate</title>
<style>
  :root{
    --navy:#0f2855; --navy-2:#14346b; --gold:#c9a227; --green:#0e6b4a;
    --orange:#b7650e; --border:#b8c5da; --label-bg:#eef2fa;
    --text:#0b1a30; --muted:#4a5a78; --muted-2:#2c3e5c; --paper:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:"Georgia","Times New Roman",Times,serif;color:var(--text);font-size:11pt;line-height:1.4}
  .page{width:210mm;min-height:297mm;margin:0 auto;padding:8mm 10mm 6mm 10mm;background:#fff;position:relative;}
  @media print{@page{size:A4;margin:0}.page{padding:6mm 8mm 4mm 8mm}}
  .watermark{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);z-index:2;opacity:0.08;pointer-events:none;}
  .watermark img{width:150mm;height:auto}
  .content{position:relative;z-index:1}

  .frame{border:6px double var(--navy);border-radius:6px;padding:7mm 8mm 6mm 8mm;position:relative}
  .frame::after{content:"";position:absolute;inset:3px;border:1px solid var(--gold);border-radius:3px;pointer-events:none}
  .letterhead{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:6px}
  .letterhead .logo-wrap{margin:0 auto 2px auto;line-height:0}
  .letterhead .logo-wrap img{width:26mm;height:auto}
  .letterhead .t1{font-family:Arial,sans-serif;font-size:9pt;font-weight:700;letter-spacing:.2px;color:var(--navy)}
  .letterhead .t2{font-family:Arial,sans-serif;font-size:9.5pt;font-weight:700;color:var(--green);margin-top:1px}
  .letterhead .t3{font-family:Arial,sans-serif;font-size:7.5pt;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-top:2px}
  .title{text-align:center;font-size:20pt;font-weight:700;letter-spacing:3px;color:var(--navy);margin:8px 0 2px 0}
  .ref{text-align:center;font-family:Arial,sans-serif;font-size:8.5pt;color:var(--muted);margin-bottom:4px}
  .ref b{color:var(--navy)}
  .body-text{font-size:11pt;line-height:2;margin:12px 4px 4px 4px;text-align:justify}
  .name-line{font-weight:800;font-size:14pt;color:var(--navy);border-bottom:2px solid var(--navy);padding:0 6px}
  .kv{width:100%;border-collapse:collapse;margin:14px 0 6px 0;font-family:Arial,sans-serif;font-size:9.5pt;border:1px solid var(--border)}
  .kv td{border:1px solid var(--border);padding:4px 8px;vertical-align:top}
  .kv .k{font-weight:700;color:var(--muted-2);width:34%;background:var(--label-bg)}
  .kv .v{font-weight:600;color:var(--text);word-break:break-word}
  .stmt{margin-top:10px;padding:6px 10px;background:#fff7e6;border-left:4px solid var(--orange);font-family:Arial,sans-serif;font-size:9pt;font-style:italic;color:var(--muted-2)}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;gap:20px}
  .sign{font-family:Arial,sans-serif;font-size:8.5pt;color:var(--muted);max-width:80mm}
  .sign .line{height:14mm;border-bottom:1px solid var(--text);margin-bottom:4px}
  .seal{text-align:right;flex:none}
  .seal .stamp{display:inline-grid;place-items:center;width:32mm;height:32mm;border:3px solid var(--green);color:var(--green);border-radius:50%;font-family:Arial,sans-serif;font-weight:900;font-size:8pt;text-align:center;transform:rotate(-12deg);opacity:.85;line-height:1.15}
  .foot{margin-top:10px;border-radius:3px;overflow:hidden;font-family:Arial,sans-serif}
  .foot .stripe{height:2px;background:linear-gradient(to right,var(--navy) 0%,var(--gold) 50%,var(--green) 100%)}
  .foot .body{background:linear-gradient(to right,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:4px 10px;text-align:center;font-size:8.5pt;font-weight:700;}
  .foot .pill{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:1px 8px;border-radius:8px;font-size:8pt;margin:0 6px}
  .foot .phone{color:#ffd96b;font-weight:700;}

  /* ---- screen-only chrome: never printed, keeps the A4 sheet clean ---- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:#fafcff;font-family:Arial,sans-serif}
  .btn{border:0;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:var(--navy);text-decoration:none;display:inline-block}
  .btn.ghost{background:#eef1f6;color:#33415c}.btn.green{background:var(--green)}
  .badge{display:inline-flex;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .badge.amber{background:#fff3d9;color:var(--orange)}.badge.green{background:#e3f7f1;color:var(--green)}
  .lock{max-width:210mm;margin:0 auto;padding:80px 20px;text-align:center;font-family:Arial,sans-serif;color:var(--muted)}
  .lock .big{font-size:52px}
  .lock h2{margin:14px 0 8px;color:var(--text)}
  .lock p{color:var(--muted);max-width:460px;margin:8px auto}
  .lock .note{max-width:460px;margin:14px auto;padding:10px 14px;background:#fff8ec;border:1px solid #f2ddae;border-radius:10px;color:#7a5b17;font-size:12px}
  @media print{.toolbar{display:none!important}}
</style>
</head>
<body>

<div class="toolbar">
  <a class="btn ghost" href="index.html">&larr; Back to system</a>
  <div style="flex:1"></div>
  <span id="statusBadge" class="badge amber">Checking&hellip;</span>
  <button class="btn green" id="printBtn" style="display:none" onclick="window.print()">&#128424; Print clearance certificate</button>
</div>

<div id="sheet"><div class="lock"><div class="big">&#128274;</div><p>Checking clearance status&hellip;</p></div></div>

<script>
const id=new URLSearchParams(location.search).get('id');
const REVIEW_LOCK_HOURS=12;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dash(v){return (v===null||v===undefined||String(v).trim()==='')?'&mdash;':esc(v)}
function dmy(v){
  if(!v) return '&mdash;';
  const s=String(v).trim().slice(0,10);
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m) return m[3]+'/'+m[2]+'/'+m[1];
  const d=new Date(String(v).replace(' ','T')+'Z');
  if(isNaN(d.getTime())) return esc(String(v).slice(0,10));
  return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
}
function row(k,v){return '<tr><td class="k">'+k+'</td><td class="v">'+dash(v)+'</td></tr>'}

function locked(a){
  const badge=document.getElementById('statusBadge');
  badge.className='badge amber';
  badge.textContent=(a&&a.status)?a.status:'Locked';
  document.getElementById('printBtn').style.display='none';
  const rev=(a&&a.review)||{};
  const wait=(a&&a.status!=='Approved'&&rev.review_locked)
    ? '<div class="note">&#128274; Review Lock ('+esc(rev.review_window_hours||REVIEW_LOCK_HOURS)+'h Required) - '+
      esc(rev.hours_remaining)+' hours remaining. The certificate unlocks once an authorized officer approves the application'+
      ' (a System Administrator can bypass the mandatory review period).</div>' : '';
  document.getElementById('sheet').innerHTML=
    '<div class="lock"><div class="big">&#128274;</div><h2>Certificate locked</h2>'+
    '<p>The clearance certificate for application <b>'+esc(id||'')+'</b> is only released after an authorized officer approves the application.</p>'+
    '<p>Current status: <b>'+esc((a&&a.status)?a.status:'Pending Review')+'</b>.</p>'+
    wait+
    '<p><a class="btn" href="application.html?id='+encodeURIComponent(id||'')+'">Go to application review &rarr;</a></p></div>';
}

function certificate(a){
  document.getElementById('statusBadge').className='badge green';
  document.getElementById('statusBadge').textContent='Approved';
  document.getElementById('printBtn').style.display='';
  const guardian=[a.guardian_name,a.guardian_relationship?'('+a.guardian_relationship+')':''].filter(Boolean).join(' ');
  document.getElementById('sheet').innerHTML=
  '<div class="page">'+
    '<div class="watermark"><img src="images/police_logo.png" alt="Police Watermark"></div>'+
    '<div class="content">'+
      '<div class="frame">'+
        '<div class="letterhead">'+
          '<div class="logo-wrap"><img src="images/police_logo.png" alt="Police Logo"></div>'+
          '<div class="t1">NORTHEASTERN POLICE FORCE &bull; CRIMINAL INVESTIGATION DIRECTORATE (2026)</div>'+
          '<div class="t2">Criminal Investigation Directorate (CID) &nbsp;|&nbsp; Code: PCC-2026-DIGITAL-01</div>'+
          '<div class="t3">Fingerprint &amp; Verification Unit</div>'+
        '</div>'+
        '<h1 class="title">CLEARANCE CERTIFICATE</h1>'+
        '<div class="ref">Certificate No. <b>'+esc(a.certificate_number)+'</b> &middot; Application '+esc(a.application_id)+'</div>'+
        '<div class="body-text">This is to certify that <span class="name-line">'+esc(a.full_name)+'</span>, '+
          'holder of National ID <b>'+esc(a.national_id)+'</b>'+
          (a.passport_id?(' and Passport <b>'+esc(a.passport_id)+'</b>'):'')+
          ', has been cleared by the Fingerprint Unit for the purpose of <b>'+esc(a.purpose)+'</b>. '+
          'No adverse criminal record is held against the above-named person in the records of the CID Criminal Unit as of the date of issue.</div>'+
        '<table class="kv">'+
          row('Full legal name',a.full_name)+
          row("Mother's full name",a.mother_name)+
          row('National ID (NIRA)',a.national_id)+
          row('Passport number',a.passport_id)+
          row('Date of birth (DD/MM/YYYY)',dmy(a.date_of_birth))+
          row('Place of birth',a.place_of_birth)+
          row('Current residential address',a.residence||a.current_address)+
          row('Occupation',a.occupation)+
          row('Purpose of application',a.purpose)+
          row('Guarantor',guardian)+
          row('Application submitted',dmy(a.created_at))+
          row('Certificate issued on',dmy(a.reviewed_at||a.updated_at))+
        '</table>'+
        '<div class="stmt">This certificate is issued on the basis of the records available to the Criminal Investigation Directorate at the time of issue and does not exempt the holder from any lawful security procedure.</div>'+
        '<div class="bottom">'+
          '<div class="sign"><div class="line"></div>Authorized officer signature, name &amp; stamp</div>'+
          '<div class="seal"><span class="stamp">POLICE<br>CLEARED<br>&#10003;</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="foot"><div class="stripe"></div><div class="body">'+
        'Criminal Investigation Directorate - North East State of Somalia'+
        '<span class="pill">Fingerprint &amp; Verification Unit</span>'+
        '<span class="phone">&#9742; +252-2754131</span>'+
      '</div></div>'+
    '</div>'+
  '</div>';
}

async function getToken(){
  try{
    const t=localStorage.getItem('sentinel_token');
    if(t) return t;
    const s=JSON.parse(localStorage.getItem('sentinelSession')||'null');
    if(s && s.token) return s.token;
  }catch(_){}
  const login=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'ChangeMe123!'})});
  const data=await login.json();
  return data.token;
}
async function load(){
  try{
    const token=await getToken();
    const r=await fetch('/api/clearance-applications/'+id,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok)throw new Error('not found');
    const a=await r.json();
    if(a.status==='Approved'&&a.certificate_number)certificate(a);else locked(a);
  }catch(e){
    const db=JSON.parse(localStorage.getItem('sentinelDB')||'null');
    const fp=db&&db.fingerprint.find(x=>x.id===id);
    if(fp&&fp.status==='Approved'&&fp.certificate){
      const p=db.people.find(x=>x.id===fp.person)||{};
      certificate({application_id:fp.id,certificate_number:fp.certificate,full_name:p.name,national_id:p.nationalId,
        passport_id:p.passportId,mother_name:p.motherName,date_of_birth:p.dob,place_of_birth:p.pob,
        residence:p.residence,occupation:p.occupation,purpose:fp.purpose,guardian_name:fp.guardian,
        guardian_relationship:'',created_at:fp.created_at,reviewed_at:''});
    }else locked(fp?{status:fp.status}:null);
  }
}
load();
</script>
</body>
</html>
