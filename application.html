<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fingerprint Application · Review</title>
<style>
:root{--blue:#246bfe;--ink:#172033;--muted:#68758a;--line:#e3e9f2;--green:#16856b;--amber:#c98512;--red:#d84f5a;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink);background:var(--bg)}
.wrap{max-width:880px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px #1020400d;overflow:hidden}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:#fafcff;position:sticky;top:0}
.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:var(--blue)}
.btn.green{background:var(--green)}.btn.ghost{background:#eef1f6;color:#33415c}
.badge{display:inline-flex;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}
.badge.amber{background:#fff3d9;color:var(--amber)}.badge.green{background:#e3f7f1;color:var(--green)}
.sheet{padding:34px 40px}
.letterhead{text-align:center;border-bottom:3px double #11233f;padding-bottom:18px;margin-bottom:8px}
.crest{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#3c83ff,#18c4ad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin:0 auto 8px}
.letterhead h1{margin:2px 0;font-size:21px;letter-spacing:.5px}.letterhead .org{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.doc-title{text-align:center;margin:20px 0 26px}.doc-title h2{margin:0;font-size:18px}.doc-title .ref{color:var(--muted);font-size:13px;margin-top:4px}
.photo{width:120px;height:140px;border:1px solid var(--line);border-radius:10px;object-fit:cover;background:#eef1f6;float:right;margin:0 0 10px 18px}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);border-bottom:2px solid #eef3ff;padding-bottom:6px;margin:24px 0 12px;clear:both}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
.row{display:flex;font-size:14px;padding:7px 0;border-bottom:1px dashed #eef1f6}.row .k{width:200px;color:var(--muted);font-weight:600;flex:none}.row .v{font-weight:600}
.docs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.doc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;background:#f7f9ff}
.doc a{color:var(--blue);text-decoration:none}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}.sign .box{border-top:1px solid #9aa7bd;padding-top:8px;font-size:12px;color:var(--muted)}
.verify{background:#fff8ec;border:1px solid #f2ddae;color:#7a5b17;border-radius:10px;padding:12px 14px;font-size:13px;margin:18px 0}
.lock{padding:60px 40px;text-align:center}.lock .big{font-size:44px}
.toast{position:fixed;right:24px;bottom:24px;background:#132642;color:#fff;padding:13px 17px;border-radius:10px;display:none;font-size:13px}
@media print{.toolbar,.no-print{display:none!important}.wrap{box-shadow:none;border:0;margin:0;max-width:100%}.sheet{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar no-print">
    <a class="btn ghost" href="index.html">← Back to system</a>
    <div style="flex:1"></div>
    <span id="statusBadge" class="badge amber">Pending Review</span>
    <button class="btn" onclick="window.print()">🖨 Print for applicant review</button>
    <button class="btn green" id="approveBtn" onclick="approve()">✓ Approve Application</button>
  </div>
  <div class="sheet" id="sheet"><div style="text-align:center;color:var(--muted);padding:60px">Loading application…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const id=new URLSearchParams(location.search).get('id');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
let app=null;
function docList(json){try{return JSON.parse(json||'[]')}catch(e){return[]}}
function row(k,v){return `<div class="row"><span class="k">${k}</span><span class="v">${esc(v||'—')}</span></div>`}
function render(a){
  app=a;
  const approved=a.status==='Approved';
  document.getElementById('statusBadge').className='badge '+(approved?'green':'amber');
  document.getElementById('statusBadge').textContent=a.status;
  document.getElementById('approveBtn').style.display=approved?'none':'';
  const appDocs=docList(a.applicant_docs),guardDocs=docList(a.guardian_docs);
  const photo=a.photo_path?`<img class="photo" src="${a.photo_path}" alt="photo">`:'';
  document.getElementById('sheet').innerHTML=`
   <div class="letterhead"><div class="crest">S</div><div class="org">Somaliland Police Force · Sentinel</div><h1>Fingerprint Unit — Clearance Application</h1><div class="org">Hargeisa Branch</div></div>
   <div class="doc-title"><h2>APPLICANT REVIEW COPY</h2><div class="ref">Application No. <b>${esc(a.application_id)}</b> · Submitted ${esc((a.created_at||'').slice(0,10))}</div></div>
   <div class="verify no-print">Day 1 — Please print this page and ask the applicant to check every field carefully. Report any error to the officer before approval.</div>
   ${photo}
   <h3 class="sec">Applicant information</h3>
   <div class="grid">
     ${row('Full name',a.full_name)}${row('National ID',a.national_id)}
     ${row("Mother's name",a.mother_name)}${row('Date of birth',a.date_of_birth)}
     ${row('Place of birth',a.place_of_birth)}${row('Residence',a.residence)}
     ${row('Occupation',a.occupation)}${row('Passport ID',a.passport_id)}
     ${row('Phone',a.phone)}${row('Clearance reason',a.purpose)}
   </div>
   <h3 class="sec">Applicant attachments (${appDocs.length})</h3>
   <div class="docs">${appDocs.map(d=>`<span class="doc"><a href="${d.path}" target="_blank">📎 ${esc(d.name)}</a></span>`).join('')||'<span class="muted">—</span>'}</div>
   <h3 class="sec">Guardian / next of kin</h3>
   <div class="grid">
     ${row('Guardian name',a.guardian_name)}${row('Relationship',a.guardian_relationship)}
     ${row('Guardian ID',a.guardian_id)}${row('Occupation',a.guardian_occupation)}
     ${row('Address',a.guardian_address)}${row('Contact number',a.guardian_phone)}
   </div>
   <h3 class="sec">Guardian attachments (${guardDocs.length})</h3>
   <div class="docs">${guardDocs.map(d=>`<span class="doc"><a href="${d.path}" target="_blank">📎 ${esc(d.name)}</a></span>`).join('')||'<span class="muted">—</span>'}</div>
   ${a.notes?`<h3 class="sec">Supporting document notes</h3><div style="font-size:14px">${esc(a.notes)}</div>`:''}
   <div class="sign"><div class="box">Applicant signature &amp; date<br><br>________________________________</div><div class="box">Receiving officer signature &amp; stamp<br><br>________________________________</div></div>`;
}
async function getToken(){
  // Reuse the active session if the main UI is signed in (same origin, same port).
  try{
    const t=localStorage.getItem('sentinel_token');
    if(t) return t;
    const s=JSON.parse(localStorage.getItem('sentinelSession')||'null');
    if(s && s.token) return s.token;
  }catch(_){}
  // Fallback: sign in as the system admin (development convenience).
  const login=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'ChangeMe123!'})});
  const data=await login.json();
  return data.token;
}
async function approve(){
  try{
    const token=await getToken();
    const r=await fetch('/api/clearance-applications/'+id+'/approve',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:'{}'});
    const data=await r.json();if(!r.ok)throw new Error(data.error||'Approval failed');
    toast('Approved. Certificate '+data.certificate_number+' unlocked.');
    load(true);
  }catch(e){toast('Cannot approve in local demo mode: '+e.message)}
}
async function load(){
  try{
    const token=await getToken();
    const r=await fetch('/api/clearance-applications/'+id,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok)throw new Error('not found');
    render(await r.json());
  }catch(e){
    // local demo fallback
    const db=JSON.parse(localStorage.getItem('sentinelDB')||'null');
    const fp=db&&db.fingerprint.find(x=>x.id===id);
    if(fp){const p=db.people.find(x=>x.id===fp.person)||{};render({application_id:fp.id,status:fp.status,full_name:p.name,national_id:p.nationalId,mother_name:p.motherName,date_of_birth:p.dob,place_of_birth:p.pob,residence:p.residence,occupation:p.occupation,passport_id:p.passportId,phone:p.phone,purpose:fp.purpose,guardian_name:fp.guardian,applicant_docs:'[]',guardian_docs:'[]'})}
    else document.getElementById('sheet').innerHTML='<div class="lock"><div class="big">🔒</div><p>Application not found. Open it from the Fingerprint register while running the server.</p><a class="btn ghost" href="index.html">Back to system</a></div>';
  }
}
load();
</script>
</body></html>
